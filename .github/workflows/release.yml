# GitHub Actions Release.
#
# Triggered by pushing a version tag (`v*`) whose commit is on `main`. It builds and zips
# both targets, then submits the new Firefox version — extension zip AND sources zip — to
# AMO's **listed** channel via `wxt submit`, so Mozilla hosts and auto-updates it. A GitHub
# Release is also published with the zips attached (the Chrome zip is uploaded to the Chrome
# Web Store by hand for now). See docs/PUBLISHING.md and docs/adr/0010.
#
# Ordinary pushes/PRs are handled by ci.yml (type-check + build); this workflow is the only
# one that ships anything, and only from a version tag on main.

name: Release

on:
  push:
    tags:
      - 'v*'

# gh release create needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can verify the tag's commit is on main.
          fetch-depth: 0

      # Refuse to release from a tag that isn't on main (e.g. tagged on a stray branch).
      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to release."
            exit 1
          fi

      - name: Enable pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # WXT reads the extension version from package.json. The tag must match it, so a
      # release can never ship a version that differs from what's baked into the manifest.
      # (AMO also rejects re-submitting an already-used version, so every release must bump.)
      - name: Resolve & verify version
        id: v
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump package.json, commit, then tag v$PKG_VERSION."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Type check
        run: pnpm check

      # `wxt zip` builds then zips. Produces .output/*-chrome.zip, *-firefox.zip, *-sources.zip.
      - name: Build & package both targets
        run: |
          pnpm zip
          pnpm zip:firefox

      # Upload the new version + sources to AMO's listed channel and submit for review.
      # Mozilla reviews and, once approved, publishes and auto-updates it — no manual upload.
      # Fails loudly if the API credentials aren't configured (see docs/PUBLISHING.md).
      - name: Submit new version to AMO (listed)
        env:
          FIREFOX_EXTENSION_ID: qol@dreamland-reborn.net
          FIREFOX_CHANNEL: listed
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          if [ -z "$FIREFOX_JWT_ISSUER" ] || [ -z "$FIREFOX_JWT_SECRET" ]; then
            echo "::error::FIREFOX_JWT_ISSUER / FIREFOX_JWT_SECRET repo secrets are not set. See docs/PUBLISHING.md."
            exit 1
          fi
          V="${{ steps.v.outputs.version }}"
          pnpm exec wxt submit \
            --firefox-zip ".output/dreamland-reborn-qol-$V-firefox.zip" \
            --firefox-sources-zip ".output/dreamland-reborn-qol-$V-sources.zip"

      # gh is preinstalled on the runner; no third-party action needed. Archives the build and
      # gives the Chrome zip a home for the (still manual) Chrome Web Store upload.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ".output/dreamland-reborn-qol-$V-chrome.zip" \
            ".output/dreamland-reborn-qol-$V-firefox.zip" \
            ".output/dreamland-reborn-qol-$V-sources.zip"
