# GitHub Actions Release.
#
# Triggered by pushing a version tag (`v*`) whose commit is on `main`. It builds and zips
# both targets, then submits the new Firefox version — extension zip AND sources zip — to
# AMO's **listed** channel via `wxt submit`, so Mozilla hosts and auto-updates it, and the
# Chrome version to the Chrome Web Store's unlisted listing (skipped until that listing
# exists — see the step's comment). A GitHub Release is also published with the zips
# attached. See docs/PUBLISHING.md, docs/adr/0010 and docs/adr/0018.
#
# Ordinary pushes/PRs are handled by ci.yml (type-check + build); this workflow is the only
# one that ships anything, and only from a version tag on main.

name: Release

on:
  push:
    tags:
      - 'v*'

# gh release create needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can verify the tag's commit is on main.
          fetch-depth: 0

      # Refuse to release from a tag that isn't on main (e.g. tagged on a stray branch).
      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to release."
            exit 1
          fi

      - name: Enable pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # WXT reads the extension version from package.json. The tag must match it, so a
      # release can never ship a version that differs from what's baked into the manifest.
      # (AMO also rejects re-submitting an already-used version, so every release must bump.)
      - name: Resolve & verify version
        id: v
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump package.json, commit, then tag v$PKG_VERSION."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Type check
        run: pnpm check

      # `wxt zip` builds then zips. Produces .output/*-chrome.zip, *-firefox.zip, *-sources.zip.
      - name: Build & package both targets
        run: |
          pnpm zip
          pnpm zip:firefox

      # Upload the new version + sources to AMO's listed channel and submit for review.
      # Mozilla reviews and, once approved, publishes and auto-updates it — no manual upload.
      # Fails loudly if the API credentials aren't configured (see docs/PUBLISHING.md).
      - name: Submit new version to AMO (listed)
        env:
          FIREFOX_EXTENSION_ID: qol@dreamland-reborn.net
          FIREFOX_CHANNEL: listed
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          if [ -z "$FIREFOX_JWT_ISSUER" ] || [ -z "$FIREFOX_JWT_SECRET" ]; then
            echo "::error::FIREFOX_JWT_ISSUER / FIREFOX_JWT_SECRET repo secrets are not set. See docs/PUBLISHING.md."
            exit 1
          fi
          V="${{ steps.v.outputs.version }}"
          pnpm exec wxt submit \
            --firefox-zip ".output/dreamland-reborn-qol-$V-firefox.zip" \
            --firefox-sources-zip ".output/dreamland-reborn-qol-$V-sources.zip"

      # Upload the new version to the Chrome Web Store (unlisted listing) and submit for review.
      # Unlike the AMO step this one *skips* rather than fails when unconfigured: the CWS API can
      # only update an item that already exists, so the very first upload is manual and there is
      # no extension id to submit to until it has happened. Once the listing exists, set the
      # CHROME_EXTENSION_ID repo variable and the three OAuth secrets and this starts running.
      # See docs/PUBLISHING.md and docs/adr/0018.
      - name: Submit new version to the Chrome Web Store
        if: vars.CHROME_EXTENSION_ID != ''
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -z "$CHROME_CLIENT_ID" ] || [ -z "$CHROME_CLIENT_SECRET" ] || [ -z "$CHROME_REFRESH_TOKEN" ]; then
            echo "::error::CHROME_EXTENSION_ID is set but the CHROME_CLIENT_ID / CHROME_CLIENT_SECRET / CHROME_REFRESH_TOKEN secrets are not. See docs/PUBLISHING.md."
            exit 1
          fi
          V="${{ steps.v.outputs.version }}"
          pnpm exec wxt submit --chrome-zip ".output/dreamland-reborn-qol-$V-chrome.zip"

      - name: Note that the Chrome step was skipped
        if: vars.CHROME_EXTENSION_ID == ''
        run: |
          echo "::notice::Chrome Web Store submission skipped — CHROME_EXTENSION_ID repo variable is unset. Upload .output/*-chrome.zip by hand (attached to the GitHub Release); see docs/PUBLISHING.md."

      # gh is preinstalled on the runner; no third-party action needed. Archives the build, and
      # keeps the Chrome zip reachable for a manual upload while the step above is unconfigured.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ".output/dreamland-reborn-qol-$V-chrome.zip" \
            ".output/dreamland-reborn-qol-$V-firefox.zip" \
            ".output/dreamland-reborn-qol-$V-sources.zip"
