# UI text catalog — single source of truth for all user-facing strings.
# Compiled by @wxt-dev/i18n into _locales/fr/messages.json at build time.
# See docs/adr/0009-i18n-wxt-i18n.md. Add a new language by adding <lang>.yml.

# Store/add-ons listing. Referenced from the manifest as __MSG_extName__ / __MSG_extDescription__.
# This name & summary are what show on the AMO listing (and in the browser after install).
extName: Dreamland Reborn QoL
extDescription: Améliorations de Qualité de Vie sur DR

popup:
  soon: bientôt
  # `bootFeatures` reads the enabled flags once, when the content script starts,
  # so a toggle only takes effect on the next page load. Say so rather than
  # letting the user watch an in-page panel outlive the switch they just flipped.
  reloadHint: Rechargez la page du forum pour appliquer les changements.
  # Shown when writing a toggle to storage rejects. The switch is put back to where it
  # was, so this explains why it moved on its own rather than leaving the user to guess.
  saveFailed: Échec de l'enregistrement. Le réglage n'a pas été modifié.
  # The cog next to the popup's title. It only opens the options page — nothing
  # needing a native dialog can live in the popup, which closes the instant one
  # steals focus. See docs/adr/0021-json-export-import.md.
  openOptions: Ouvrir les options

# The extension's full-tab options page (manifest `options_ui`), one section per
# area of settings. `title` doubles as the page's <h1> and its document.title.
options:
  title: Dreamland Reborn QoL — Options
  intro: >-
    Réglages de l'extension. Les fonctionnalités s'activent depuis le menu de
    l'extension ; cette page sert à les configurer en détail.
  sectionsLabel: Sections
  # Export/import of settings + BBCode presets as a single JSON file. Highlights
  # are deliberately excluded. Not feature-scoped (it covers the feature toggles
  # *and* the preset library), so it lives under `options`, not under any one
  # `features.<name>`. See docs/adr/0021-json-export-import.md.
  backup:
    heading: Sauvegarde et restauration
    intro: >-
      Exportez vos réglages, vos préréglages BBCode et vos emoji récents dans un
      fichier JSON, à conserver ou à réutiliser sur un autre navigateur — puis
      réimportez-le ici, en choisissant précisément ce qu'il faut restaurer.
    exportButton: Exporter (.json)
    importButton: Importer un fichier…
    exportFailed: Échec de l'export — aucun fichier n'a été créé.
    invalidFile: Fichier invalide — rien n'a été importé.
    nothingToImport: Ce fichier ne contient rien à importer.
    importNothingSelected: Rien n'était sélectionné — aucun changement.
    importDone: Import terminé.
    # `bootFeatures` reads the enabled flags once, at content-script boot, so
    # imported toggles need a reload just like the popup's own switches do.
    importDoneWithSettings: >-
      Import terminé. Rechargez la page du forum pour appliquer les
      réglages importés.
    importFailed: Échec de l'import.
    modal:
      heading: Choisir ce qu'il faut importer
      settingsLabel: Remplacer les réglages actuels (activation des fonctionnalités)
      # Unchecked by default: the recents list is replaced, not merged.
      emojiLabel: Remplacer la liste des emoji récents
      presetsHeading: Préréglages
      noPresetsInFile: Aucun préréglage dans ce fichier.
      badgeIdentical: Identique à l'existant
      badgeConflict: Remplacera un préréglage existant (contenu différent)
      cancel: Annuler
      confirm: Importer la sélection

# Key segments mirror each feature's exported const name, in camelCase
# (exitGuard, bbcodePresets, colorGrab) — NOT the kebab-case Feature.id, because
# compiled message-key names allow only [A-Za-z0-9_], no hyphens.
features:
  exitGuard:
    name: Protection contre la perte de message
    description: >-
      Avertit avant de quitter un éditeur contenant du texte non envoyé, et
      vérifie que le serveur répond avant d'envoyer, de prévisualiser ou
      d'enregistrer un brouillon.
    serverDown:
      title: Serveur indisponible
      message: >-
        Le serveur ne répond pas. Réessayez plus tard — rien n'a été envoyé
        et votre texte est toujours là.
      stay: Rester sur la page
      continueAnyway: Continuer quand même
  highlight:
    name: Surlignage du texte
    description: >-
      Surligne des passages d'un message et les conserve — même après
      rechargement et entre le sujet et la fenêtre de réponse — jusqu'à ce que
      vous les effaciez.
    # Palette offered by the selection toolbar. Segment keys mirror
    # HIGHLIGHT_COLORS ids in src/features/highlight/palette.ts.
    colors:
      yellow: Jaune
      green: Vert
      pink: Rose
      blue: Bleu
    # The floating selection toolbar injected into the post.
    toolbar:
      remove: Retirer le surlignage
    # The in-page corner control. count uses @wxt-dev/i18n plurals — all THREE
    # forms are required (CLAUDE.md): two forms make French render "0 surlignages".
    control:
      count:
        "0": Aucun surlignage
        "1": 1 surlignage
        "n": $1 surlignages
      clearTopic: Effacer ce sujet
      clearAll: Tout effacer
    # The popup accordion panel.
    popup:
      count:
        "0": Aucun surlignage enregistré
        "1": 1 surlignage enregistré
        "n": $1 surlignages enregistrés
      clearTopic: Effacer ce sujet
      clearAll: Tout effacer
      noThread: Ouvrez un sujet du forum pour en effacer les surlignages.
  bbcodePresets:
    name: Préréglages BBCode
    description: Insère des structures BBCode complexes en un clic.
    # In-page UI, injected into the phpBB composer by the content script.
    # NOTE: never write a bare {SELECTION} / {CURSOR} in this file — @wxt-dev/i18n
    # reads /\{[A-Za-z0-9_]+\}/ as a named substitution and then *requires* it.
    # Pass the tokens in as lowercase substitutions instead, from the constants in
    # src/features/bbcode-presets/template.ts.
    trigger:
      title: Préréglages BBCode
    menu:
      empty: Aucun préréglage
      emptyHint: Créez-en depuis les options de l'extension.
    panel:
      title: Préréglages
      expand: Afficher les préréglages
      collapse: Masquer les préréglages
    # Popup accordion panel. The count keys use @wxt-dev/i18n plurals: all THREE
    # forms are required — with only "1"/"n" the runtime picks n for zero and
    # renders "0 préréglages", which is wrong in French.
    popup:
      presetCount:
        "0": aucun préréglage
        "1": 1 préréglage
        "n": $1 préréglages
      folderCount:
        "0": aucun dossier
        "1": 1 dossier
        "n": $1 dossiers
      manage: Gérer les préréglages…
    # Options page — the full preset editor.
    editor:
      heading: Préréglages BBCode
      intro: >-
        Organisez vos préréglages en dossiers — un par personnage, par exemple.
        Les modifications sont enregistrées automatiquement.
      addFolder: Nouveau dossier
      addPreset: Nouveau préréglage
      delete: Supprimer
      deleteFolderConfirm: Supprimer ce dossier et tout ce qu'il contient ?
      deletePresetConfirm: Supprimer ce préréglage ?
      untitledFolder: Nouveau dossier
      untitledPreset: Nouveau préréglage
      nameLabel: Nom
      moveLabel: Déplacer vers
      root: Racine
      bodyLabel: Contenu BBCode
      previewLabel: Aperçu
      previewSample: texte sélectionné
      empty: Aucun préréglage pour l'instant.
      noSelection: Sélectionnez un préréglage à gauche, ou créez-en un.
      saved: Enregistré
      saveFailed: Échec de l'enregistrement — vos modifications n'ont pas été enregistrées.
      warningsLabel: Avertissements
      # {sel} / {cur} / {filters} / {example} / {filter} are @wxt-dev/i18n named
      # substitutions, filled from the constants in template.ts. Writing the real
      # tokens here would be read as substitutions named SELECTION and CURSOR.
      syntaxHelp: >-
        Utilisez {sel} pour insérer le texte sélectionné, et {cur} pour choisir
        où placer le curseur après l'insertion.
      filtersHelp: "Filtres disponibles : {filters}. Par exemple : {example}"
      warningUnknownFilter: "Filtre inconnu, ignoré : {filter}"
      warningDuplicateCursor: "{cur} n'est pris en compte qu'une seule fois."
  colorGrab:
    name: Pipette de couleur
    description: >-
      Filtre la palette de couleurs du forum pour ne montrer que celles déjà
      utilisées dans la relecture du sujet, et indique qui les emploie.
    # Augments phpBB's own colour palette (#colour_palette) with a checkbox.
    # {color} / {roster} are @wxt-dev/i18n named substitutions, filled from the
    # feature (the hex and the "Nom ×N, …" list) — safe, unlike the {SELECTION}
    # trap documented in CLAUDE.md.
    filter:
      label: Sur la page
      usedBy: "{color} — utilisée par {roster}"
  editorShortcuts:
    name: Raccourcis clavier
    description: >-
      Ajoute des raccourcis aux boutons BBCode de l'éditeur et de la Tribune —
      Ctrl+B, Ctrl+I, Alt+Q… — identiques sur Firefox et Chrome, actifs
      uniquement dans une zone de rédaction.
    # Rewrites each toolbar button's own tooltip. {base} is phpBB's original
    # title, {combo} the shortcut(s) — both are intended @wxt-dev/i18n named
    # substitutions, unlike the {SELECTION} trap documented above.
    tooltip: "{base} ({combo})"
  emojiPicker:
    name: Sélecteur d'emoji
    description: >-
      Insère des emoji Unicode dans l'éditeur et la Tribune, avec une recherche
      en français et en anglais — depuis la barre d'outils ou avec Alt+I.
    trigger:
      title: Emoji
      # {base} is the label above, {combo} the shortcut — intended @wxt-dev/i18n
      # named substitutions, unlike the {SELECTION} trap documented above.
      tooltip: "{base} ({combo})"
    panel:
      title: Sélecteur d'emoji
      searchLabel: Rechercher un emoji
      searchPlaceholder: Rechercher…
      recent: Récents
      categoriesLabel: Catégories
      noResults: Aucun emoji ne correspond.
      loading: Chargement des emoji…
      loadFailed: Impossible de charger la liste des emoji.
      # insertAtRange refuses an insertion that would exceed the textarea's
      # maxlength — the Tribune caps messages at 1040 characters — and would
      # otherwise do nothing at all, with no explanation.
      tooLong: Message trop long — l'emoji n'a pas été inséré.
